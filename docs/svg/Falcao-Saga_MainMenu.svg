<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02C57A"/>
      <stop offset="100%" stop-color="#015A38"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bgGrad)"/>

  <!-- Content container with 5% margin -->
  <g transform="translate(36, 64)">

    <!-- Title -->
    <text x="324" y="30" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="38" fill="#F8FE06">FALCAO SAGA</text>
    <text x="324" y="55" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" opacity="0.8">PSS Sleman</text>

    <!-- Top Bar: Resources -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="648" height="44" rx="10" fill="#0D2B1E" opacity="0.7"/>
      <!-- Coins -->
      <text x="81" y="28" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#F8FE06">🪙 500</text>
      <line x1="162" y1="8" x2="162" y2="36" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
      <!-- XP -->
      <text x="243" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#FFFFFF">⭐ 120</text>
      <line x1="324" y1="8" x2="324" y2="36" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
      <!-- RPP -->
      <text x="405" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#FFFFFF">💎 0</text>
      <line x1="486" y1="8" x2="486" y2="36" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
      <!-- Lives -->
      <text x="567" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#FFFFFF">❤️ 5</text>
    </g>

    <!-- Spacer -->
    <rect x="0" y="140" width="648" height="1" opacity="0"/>

    <!-- PLAY Button -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="648" height="70" rx="14" fill="#F8FE06" filter="url(#shadow)"/>
      <text x="324" y="45" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="24" fill="#015A38">▶  MAIN</text>
    </g>

    <!-- Album Button -->
    <g transform="translate(0, 438)">
      <rect x="0" y="0" width="648" height="60" rx="12" fill="#0D2B1E" stroke="#02C57A" stroke-width="1.5" opacity="0.9"/>
      <text x="324" y="38" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="22" fill="#FFFFFF">📇  Album PSS</text>
    </g>

    <!-- Shop Button -->
    <g transform="translate(0, 516)">
      <rect x="0" y="0" width="648" height="60" rx="12" fill="#0D2B1E" stroke="#02C57A" stroke-width="1.5" opacity="0.9"/>
      <text x="324" y="38" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="22" fill="#FFFFFF">🛒  Shop</text>
    </g>

    <!-- Leaderboard Button -->
    <g transform="translate(0, 594)">
      <rect x="0" y="0" width="648" height="60" rx="12" fill="#0D2B1E" stroke="#02C57A" stroke-width="1.5" opacity="0.9"/>
      <text x="324" y="38" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="22" fill="#FFFFFF">🏆  Leaderboard</text>
    </g>

    <!-- Season Info -->
    <g transform="translate(0, 1100)">
      <rectangle x="0" y="0" width="648" height="30" rx="6" fill="none"/>
      <text x="324" y="20" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5">Season 1: Super League (2024–2026)</text>
    </g>

  </g>

  <!-- Decorative eagle watermark -->
  <text x="360" y="1100" text-anchor="middle" font-size="140" fill="#F8FE06" opacity="0.03">🦅</text>
</svg>
